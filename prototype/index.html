<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Soundtrack First Prototype</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171411; color: #f4eee5; }
    main { width: min(680px, calc(100% - 48px)); }
    p { color: #bbb5aa; line-height: 1.7; }
    .eyebrow { color: #c9a16a; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-family: Georgia, serif; font-size: clamp(3rem, 8vw, 6rem); font-weight: 400; letter-spacing: -.06em; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Soundtrack First</div>
    <h1>Prototype</h1>
    <p>This isolated workspace is ready for the next version of the site. The existing website has not been changed.</p>
  </main>
</body>
</html>
